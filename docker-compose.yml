# ============================================================
#  RoomDesk —— PostgreSQL 16 + Docker Compose 的完整本地"生产形态"
#
#  数据链路：
#      api ──▶ pgbouncer:6432（事务池）──▶ db:5432
#      worker ──直连──▶ db:5432   （LISTEN/NOTIFY 与 REFRESH CONCURRENTLY 不能走池子）
#      migrator（一次性）: 超级用户 bootstrap → migrator 跑迁移 → seed
#
#  启动顺序全靠健康检查/退出码，不靠 sleep：
#      db(healthy) → migrator(completed) ┬→ api(healthy)
#      db(healthy) → pgbouncer(healthy) ─┘
#      db(healthy) + migrator(completed) → worker
# ============================================================
name: roomdesk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------
  # 1. PostgreSQL 16
  # ------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: roomdesk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomdesk}
      POSTGRES_DB: ${DB_NAME:-roomdesk}
      PGTZ: ${TZ:-Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=256MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200ms
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - log_checkpoints=on
    shm_size: "256mb"
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    stop_grace_period: 30s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ------------------------------------------------------------
  # 2. 迁移容器（一次性）：bootstrap → migrations → seed
  #    这是"生产化"的关键：把 DDL 从应用启动路径里摘出来
  # ------------------------------------------------------------
  migrator:
    image: postgres:16-alpine
    container_name: roomdesk-migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      DB_NAME: ${DB_NAME:-roomdesk}
      SUPERUSER_USER: ${POSTGRES_USER:-roomdesk}
      SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-roomdesk}
      MIGRATOR_USER: ${MIGRATOR_USER:-roomdesk_migrator}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-migrator_pw}
      APP_USER: ${APP_USER:-roomdesk_app}
      APP_PASSWORD: ${APP_PASSWORD:-app_pw}
      READER_USER: ${READER_USER:-roomdesk_reader}
      READER_PASSWORD: ${READER_PASSWORD:-reader_pw}
      SEED: ${SEED:-1}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./db:/workspace/db:ro
      - ./scripts:/workspace/scripts:ro
    working_dir: /workspace
    entrypoint: ["bash", "/workspace/scripts/migrate.sh"]
    restart: "no"
    logging: *default-logging

  # ------------------------------------------------------------
  # 3. pgbouncer：事务连接池（自建镜像，见 pgbouncer/Dockerfile）
  #    只在内网暴露 6432，不映射到宿主
  # ------------------------------------------------------------
  pgbouncer:
    build:
      context: ./pgbouncer
    container_name: roomdesk-pgbouncer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${APP_USER:-roomdesk_app}
      DB_PASSWORD: ${APP_PASSWORD:-app_pw}
      ADMIN_USER: ${PGBOUNCER_ADMIN_USER:-pgb_admin}
      ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:-pgb_admin_pw}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "6432"
    logging: *default-logging
    restart: unless-stopped

  # ------------------------------------------------------------
  # 4. API（多阶段构建：runtime 目标 = 不带测试依赖；2 个 worker 进程）
  # ------------------------------------------------------------
  api:
    build:
      context: ./app
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: roomdesk-api
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    environment:
      # 注意：连的是 pgbouncer，不是 db
      DATABASE_URL: postgresql://${APP_USER:-roomdesk_app}:${APP_PASSWORD:-app_pw}@pgbouncer:6432/${DB_NAME:-roomdesk}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ------------------------------------------------------------
  # 4b. 测试容器（profile: test）：用 dev 目标镜像，带 pytest
  #     因为它要打 HTTP，所以网络里用 http://api:8000，而不是 127.0.0.1
  # ------------------------------------------------------------
  test:
    profiles: ["test"]
    build:
      context: ./app
      target: dev
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: roomdesk-test
    depends_on:
      api:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      # NOTIFY 全链路用例需要 worker 在跑，否则那条用例必然失败。
      # worker 没有 HTTP 健康检查，用 service_started 即可。
      worker:
        condition: service_started
    environment:
      BASE_URL: http://api:8000
      DATABASE_URL: postgresql://${APP_USER:-roomdesk_app}:${APP_PASSWORD:-app_pw}@pgbouncer:6432/${DB_NAME:-roomdesk}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 测试代码不在运行镜像里，测试容器单独挂进来
      - ./tests:/srv/tests:ro
    command: ["python", "-m", "pytest", "-q", "tests", "-p", "no:cacheprovider"]
    restart: "no"
    logging: *default-logging

  # ------------------------------------------------------------
  # 5. worker：LISTEN/NOTIFY 消费者 + 读模型定时刷新
  #    直连 db（原因见 worker/consumer.py 顶部注释）
  # ------------------------------------------------------------
  worker:
    build:
      context: ./worker
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: roomdesk-worker
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      WORKER_DSN: postgresql://${APP_USER:-roomdesk_app}:${APP_PASSWORD:-app_pw}@db:5432/${DB_NAME:-roomdesk}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-15}
      TZ: ${TZ:-Asia/Shanghai}
    stop_grace_period: 10s
    logging: *default-logging
    restart: unless-stopped

  # ------------------------------------------------------------
  # 6. Adminer：浏览器里看表（开发便利）
  # ------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: roomdesk-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ------------------------------------------------------------
  # 7. 定时备份（可选）：docker compose --profile ops up -d backup
  # ------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: roomdesk-backup
    profiles: ["ops"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-roomdesk}
      PGPASSWORD: ${POSTGRES_PASSWORD:-roomdesk}
      PGDATABASE: ${DB_NAME:-roomdesk}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    # compose 会把字符串 command 按空格拆开，所以循环必须写在 entrypoint 数组里
    entrypoint:
      - /bin/sh
      - -c
      - "while true; do sh /scripts/backup.sh /backups; sleep 3600; done"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
