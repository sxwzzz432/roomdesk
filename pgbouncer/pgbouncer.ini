# ============================================================
#  pgbouncer.ini —— 事务池
#
#  为什么用事务池（pool_mode = transaction）：
#    每个请求在用完连接后立刻归还，几百个客户端只需要十几条真实连接。
#
#  代价（重要教学点）：
#    事务池下同一个会话会被不同客户端复用，服务端预编译语句（prepared
#    statements）会串味 —— 所以应用侧必须关掉 psycopg 的自动预编译
#    （见 app/db.py 的 prepare_threshold=None），
#    LISTEN 也不能走池子（所以 worker 直连 db:5432）。
# ============================================================

[databases]
roomdesk = host=db port=5432 dbname=roomdesk

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; 认证：plain —— 客户端发明文，pgbouncer 拿到明文后自己去和 SCRAM 的 PG 握手。
; （userlist.txt 由 entrypoint.sh 从环境变量生成，仅限内网开发环境）
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
default_pool_size = 15
min_pool_size = 1
reserve_pool_size = 5
reserve_pool_timeout = 3

; 连接归还时清理会话状态
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30

; 管理控制台（SHOW POOLS / SHOW STATS），见 make pools
admin_users = pgb_admin
stats_users = pgb_admin

; psycopg / libpq 会带这些启动参数，pgbouncer 忽略即可
ignore_startup_parameters = extra_float_digits,options

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
